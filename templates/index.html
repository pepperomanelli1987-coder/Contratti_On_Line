<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Generatore Contratti Lampade</title>
</head>
<body>
    <h1>Genera Contratto Lampade</h1>

    <form action="/genera" method="POST">

        <label>Nome completo:</label><br>
        <input type="text" name="nome_completo" required><br><br>

        <label>Luogo di nascita:</label><br>
        <input type="text" name="luogo_nascita" required><br><br>

        <label>Data di nascita:</label><br>
        <input type="text" name="data_nascita" placeholder="gg/mm/aaaa" required><br><br>

        <label>Codice Fiscale:</label><br>
        <input type="text" name="cf" required><br><br>

        <label>Comune di residenza:</label><br>
        <input type="text" name="comune_residenza" required><br><br>

        <label>Via:</label><br>
        <input type="text" name="via" required><br><br>

        <label>Telefono:</label><br>
        <input type="text" name="telefono"><br><br>

        <label>Email:</label><br>
        <input type="email" name="email"><br><br>

        <label>Metodo di pagamento:</label><br>
        <select name="metodo_pagamento" required>
            <option value="Contanti">Contanti</option>
            <option value="Carta">Carta</option>
            <option value="Bonifico">Bonifico</option>
            <option value="PagoPA">PagoPA</option>
        </select><br><br>

        <label>Numero lampade:</label><br>
        <input type="number" name="num_lampade" required><br><br>

        <label>Elenco defunti:</label><br>
        <textarea name="elenco_defunti"></textarea><br><br>

        <button type="submit">Genera Contratto</button>
    </form>
</body>
</html>
