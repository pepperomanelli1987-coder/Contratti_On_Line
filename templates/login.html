<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Accesso</title>
    <style>
        body {
            margin: 0;
            font-family: system-ui, sans-serif;
            background: #f3f4f6;
        }
        .container {
            max-width: 400px;
            margin: 80px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            text-align: center;
        }
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
        }
        button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: #2563eb;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        .error {
            margin-top: 10px;
            color: #b91c1c;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Accesso riservato</h2>
        <p>Inserisci la password per continuare</p>

        <form method="POST">
            <input type="password" name="password" placeholder="Password">
            <button type="submit">Accedi</button>

            {% if error %}
            <div class="error">Password errata</div>
            {% endif %}
        </form>
    </div>
</body>
</html>
